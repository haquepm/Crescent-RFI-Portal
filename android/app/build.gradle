plugins { id 'com.android.application' }
android {
 namespace 'com.crescentcontractors.rfi'
 compileSdk 35
 defaultConfig { applicationId 'com.crescentcontractors.rfi'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
 signingConfigs { release {
  def ks = System.getenv('CRESCENT_KEYSTORE_PATH')
  if (ks) { storeFile file(ks); storePassword System.getenv('CRESCENT_KEYSTORE_PASSWORD'); keyAlias System.getenv('CRESCENT_KEY_ALIAS'); keyPassword System.getenv('CRESCENT_KEY_PASSWORD') }
 } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
